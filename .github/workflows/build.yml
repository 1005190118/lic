name: Build & Release Machine Code (Native Image)

# 普通提交、PR 不触发。手动运行只测试和打包，不发布 Release。
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  MAIN_CLASS: org.hztech.core.plugin.license.common.util.NativeMachineCodeApp

jobs:
  test:
    name: Java unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: mvn -B -ntp clean verify
      - name: Check JVM native entrypoint
        run: |
          java -jar target/hztech-machine-code.jar --help
          java -cp target/hztech-machine-code.jar "$MAIN_CLASS" --self-test

  linux-static:
    name: Linux AMD64 (musl static)
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          distribution: graalvm-community
          java-version: '21'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
          native-image-musl: 'true'
      - name: Build executable JAR
        run: mvn -B -ntp -DskipTests clean package
      - name: Compile fully static Native Image
        shell: bash
        run: |
          set -euo pipefail
          native-image --no-fallback --static --libc=musl -march=compatibility \
            -cp target/hztech-machine-code.jar \
            "$MAIN_CLASS" \
            -o target/HzTechMachineCode
      - name: Verify static binary and fixed SHA-256 fixture
        shell: bash
        run: |
          set -euo pipefail
          file target/HzTechMachineCode
          if readelf -l target/HzTechMachineCode | grep -q INTERP; then
            echo 'ERROR: ELF still contains a dynamic loader' >&2
            exit 1
          fi
          jvm_key="$(java -cp target/hztech-machine-code.jar "$MAIN_CLASS" --self-test)"
          native_key="$(target/HzTechMachineCode --self-test)"
          test "$jvm_key" = "$native_key"
          [[ "$native_key" =~ ^[0-9A-F]{64}$ ]]
      - name: Archive
        run: |
          mkdir -p release
          tar -czf release/hztech-machine-code-linux-amd64-static.tar.gz -C target HzTechMachineCode
      - uses: actions/upload-artifact@v4
        with:
          name: hztech-machine-code-linux-amd64-static
          path: release/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  linux-glibc228:
    name: Linux ${{ matrix.arch }} (glibc 2.28 baseline)
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build executable JAR
        run: mvn -B -ntp -DskipTests clean package
      - name: Build native executable in Oracle Linux 8
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --platform "linux/${{ matrix.arch }}" \
            -v "$PWD:/workspace" \
            -w /workspace \
            --entrypoint native-image \
            ghcr.io/graalvm/native-image-community:21-ol8 \
            --no-fallback -march=compatibility \
            -cp target/hztech-machine-code.jar \
            "$MAIN_CLASS" \
            -o target/HzTechMachineCode
      - name: Check GLIBC ceiling and fixed SHA-256 fixture
        shell: bash
        run: |
          set -euo pipefail
          file target/HzTechMachineCode
          max_glibc="$(readelf -V target/HzTechMachineCode | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -Vu | tail -n 1)"
          echo "Highest referenced GLIBC symbol: $max_glibc"
          python3 - "$max_glibc" <<'PY'
          import sys
          version = tuple(map(int, sys.argv[1].split('_', 1)[1].split('.')))
          if version > (2, 28):
              raise SystemExit(f'GLIBC {version} exceeds compatibility ceiling 2.28')
          PY
          jvm_key="$(java -cp target/hztech-machine-code.jar "$MAIN_CLASS" --self-test)"
          native_key="$(target/HzTechMachineCode --self-test)"
          test "$jvm_key" = "$native_key"
          [[ "$native_key" =~ ^[0-9A-F]{64}$ ]]
      - name: Archive
        shell: bash
        run: |
          mkdir -p release
          tar -czf "release/hztech-machine-code-linux-${{ matrix.arch }}-glibc228.tar.gz" -C target HzTechMachineCode
      - uses: actions/upload-artifact@v4
        with:
          name: hztech-machine-code-linux-${{ matrix.arch }}-glibc228
          path: release/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  native-desktop:
    name: Native Image / ${{ matrix.name }}
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-amd64
            runner: windows-2025
          - name: macos-arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          distribution: graalvm-community
          java-version: '21'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: Build executable JAR
        run: mvn -B -ntp -DskipTests clean package
      - name: Compile Native Image
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = if ($IsWindows) { 'target/HzTechMachineCode.exe' } else { 'target/HzTechMachineCode' }
          & native-image --no-fallback -march=compatibility -cp 'target/hztech-machine-code.jar' $env:MAIN_CLASS -o $exe
          if ($LASTEXITCODE -ne 0) { throw "native-image exited with $LASTEXITCODE" }
      - name: Compare JVM and native fixed fixture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $jvmKey = (& java -cp 'target/hztech-machine-code.jar' $env:MAIN_CLASS --self-test | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'JVM self-test failed' }
          $exe = if ($IsWindows) { 'target/HzTechMachineCode.exe' } else { 'target/HzTechMachineCode' }
          $nativeKey = (& (Join-Path (Get-Location) $exe) --self-test | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Native self-test failed' }
          if ($jvmKey -cne $nativeKey -or $nativeKey -notmatch '^[0-9A-F]{64}$') {
            throw "JVM/Native mismatch: $jvmKey / $nativeKey"
          }
      - name: Archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          if ($IsWindows) {
            Compress-Archive -Path 'target/HzTechMachineCode.exe' -DestinationPath 'release/hztech-machine-code-${{ matrix.name }}-native.zip'
          } else {
            tar -czf 'release/hztech-machine-code-${{ matrix.name }}-native.tar.gz' -C target HzTechMachineCode
            if ($LASTEXITCODE -ne 0) { throw 'tar failed' }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: hztech-machine-code-${{ matrix.name }}-native
          path: release/*
          if-no-files-found: error
          retention-days: 14

  fallback:
    name: Bundled-JRE GUI / ${{ matrix.name }}
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-arm64
            runner: windows-11-arm
          - name: macos-amd64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build executable JAR
        run: mvn -B -ntp -DskipTests clean package
      - name: Build self-contained app-image
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path packaging-input, build, release | Out-Null
          Copy-Item 'target/hztech-machine-code.jar' 'packaging-input/hztech-machine-code.jar'
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME -replace '^v', '' } else { '1.0.0' }
          $pkgArgs = @(
            '--type', 'app-image',
            '--name', 'HzTechMachineCode',
            '--app-version', $version,
            '--input', 'packaging-input',
            '--main-jar', 'hztech-machine-code.jar',
            '--main-class', 'org.hztech.core.plugin.license.common.util.MachineCodeApp',
            '--dest', 'build'
          )
          if ($IsWindows) {
            @'
          main-jar=hztech-machine-code.jar
          main-class=org.hztech.core.plugin.license.common.util.MachineCodeApp
          arguments=--cli
          win-console=true
          '@ | Set-Content -Path 'cli-launcher.properties' -Encoding utf8
            $pkgArgs += @('--add-launcher', 'HzTechMachineCodeCLI=cli-launcher.properties')
          }
          if ($IsMacOS) {
            $pkgArgs += @('--mac-package-identifier', 'org.hztech.machinecode')
          }
          & jpackage @pkgArgs
          if ($LASTEXITCODE -ne 0) { throw "jpackage exited with $LASTEXITCODE" }
          if ($IsWindows) {
            Compress-Archive -Path 'build/HzTechMachineCode' -DestinationPath 'release/hztech-machine-code-${{ matrix.name }}-jpackage.zip'
          } else {
            tar -czf 'release/hztech-machine-code-${{ matrix.name }}-jpackage.tar.gz' -C build HzTechMachineCode.app
            if ($LASTEXITCODE -ne 0) { throw 'tar failed' }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: hztech-machine-code-${{ matrix.name }}-jpackage
          path: release/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: [linux-static, linux-glibc228, native-desktop, fallback]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: hztech-machine-code-*
          path: release
          merge-multiple: true
      - name: List release assets
        run: ls -lah release/
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          name: HzTech Machine Code ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/*.zip
            release/*.tar.gz
